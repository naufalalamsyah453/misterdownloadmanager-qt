[package]
name = "mdm-qt"
description = "Mister Download Manager, desktop app (Qt 6 / QML through cxx-qt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "misterdownloadmanager-qt"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
mdm-engine.workspace = true
tokio.workspace = true
url.workspace = true
reqwest.workspace = true

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[dev-dependencies]
mdm-labserver.workspace = true
tempfile.workspace = true
